<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Աշխեն & Ռոբերտ | Wedding</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #f6f6f6;
      color: #222;
      scroll-behavior: smooth;
    }

    h1,h2 {
      font-family: 'Playfair Display', serif;
      margin: 0;
    }

    /* HERO WITH BACKGROUND IMAGE */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      color: white;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://drive.google.com/file/d/1ZvtjEW4gcD36pqP1No-yiLXshKlyBJcs/view?usp=drive_link') center/cover no-repeat;
      transform: scale(1.05);
      filter: brightness(0.65);
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.55));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
    }

    .names {
      font-size: 60px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .date {
      margin-top: 10px;
      font-size: 20px;
      opacity: 0.9;
    }

    .countdown {
      margin-top: 25px;
      font-size: 26px;
    }

    /* MUSIC BUTTON */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 999;
    }

    /* SECTIONS */
    .section {
      padding: 70px 20px;
      background: white;
      margin: 15px auto;
      max-width: 1000px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      opacity: 0;
      transform: translateY(40px);
      transition: 0.8s;
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* SLIDER */
    .slider {
      overflow: hidden;
      border-radius: 15px;
      max-width: 700px;
      margin: auto;
    }

    .slides {
      display: flex;
      transition: transform 0.6s ease;
    }

    .slides img {
      width: 100%;
    }

    .controls button {
      background: black;
      color: white;
      border: none;
      padding: 10px 14px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      border: none;
    }

    input, select {
      padding: 12px;
      width: 260px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mp3">
</audio>
<button class="music-btn" onclick="toggleMusic()">🎵</button>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <div class="names">Ալաշեն & Ռոբերտ</div>
    <div class="date">21 Սեպտեմբերի, 2026</div>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<!-- STORY -->
<div class="section">
  <h2>Մեր սիրո պատմությունը</h2>
  <p>Սկիզբը մի պահ էր… շարունակությունը՝ հավերժություն ✨</p>
</div>

<!-- SLIDER -->
<div class="section">
  <h2>Մեր նկարները</h2>

  <div class="slider">
    <div class="slides" id="slides">
      <img src="https://drive.google.com/file/d/1zkzcP1uHI4XMPQvpbb8T2BfQnD-P0M4n/view?usp=drive_link">
      <img src="https://drive.google.com/file/d/1I5mRvPmbbJCYdhcwpTNFWvqiQ2WiBIy-/view?usp=drive_link">
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">←</button>
    <button onclick="next()">→</button>
  </div>
</div>

<!-- PLACES -->
<div class="section">
  <h2>Վայրերը</h2>
  <p><b>Եկեղեցի:</b> Սուրբ Գևորգ</p>
  <p><b>Դահլիճ:</b> Աղաբաբյանց համալիր</p>
</div>

<!-- MAPS -->
<div class="section">
  <h2>Քարտեզներ</h2>

  <h3>Եկեղեցի</h3>
  <iframe src="https://www.google.com/maps?q=Saint+Georg+Church+Yerevan&output=embed"></iframe>

  <h3>Դահլիճ</h3>
  <iframe src="https://www.google.com/maps?q=Aghababyan+Hall+Yerevan&output=embed"></iframe>
</div>

<!-- RSVP -->
<div class="section">
  <h2>Հաստատեք մասնակցությունը</h2>

  <input id="name" placeholder="Անուն">
  <select id="attending">
    <option value="yes">Այո</option>
    <option value="no">Ոչ</option>
  </select>
  <select id="guests">
    <option value="0">Միայն ես</option>
    <option value="1">+1</option>
    <option value="2">+2</option>
  </select>

  <button onclick="submitRSVP()">Ուղարկել</button>
  <p id="response"></p>
</div>

<script>
const weddingDate = new Date("2026-09-21T00:00:00");

setInterval(() => {
  const now = new Date();
  const diff = weddingDate - now;
  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor(diff / (1000*60*60)%24);
  const m = Math.floor(diff / (1000*60)%60);
  document.getElementById("countdown").innerText = `${d} օր ${h} ժամ ${m} րոպե`;
},1000);

// SLIDER
let i = 0;
function update(){
  document.getElementById("slides").style.transform = `translateX(${-i*100}%)`;
}
function next(){ i=(i+1)%2; update(); }
function prev(){ i=(i-1+2)%2; update(); }
  setInterval(() => {
  next();
}, 3500);

// SCROLL ANIMATION
const sections=document.querySelectorAll(".section");
const obs=new IntersectionObserver(e=>{
  e.forEach(x=>{if(x.isIntersecting)x.target.classList.add("visible")});
});
sections.forEach(s=>obs.observe(s));

// MUSIC
function toggleMusic(){
  const m=document.getElementById("music");
  if(m.paused)m.play(); else m.pause();
}

// RSVP
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyqNqMF5A3pDb5Xv8trEEhtgqIjQ8xYhsVh0B-Kc6FmonQN9Hir5Xs2QmMrW4DtbUkKw/exec";

function submitRSVP(){
  const name = document.getElementById("name").value;
  const attending = document.getElementById("attending").value;
  const guests = document.getElementById("guests").value;

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      name,
      attending,
      guests
    })
  });

  document.getElementById("response").innerText = "Շնորհակալություն 💌";
}
</script>

</body>
</html>
